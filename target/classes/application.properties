spring.application.name=exportadora
server.port=8088
spring.datasource.url=jdbc:postgresql://localhost:5432/equipoNBDPC1
spring.datasource.username=postgres
spring.datasource.password=postgre
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# create => recrea las tablas y ejecuta import.sql (datos de prueba) en cada arranque
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.root=INFO

# para que se vea el mensaje de error (ej. producto ya existe)
server.error.include-message=always

